name: iOS release (EAS build + App Store submit)

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit to App Store Connect after the build"
        type: boolean
        default: true

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUNDLE_ID: app.rork.blokarcade-match-run-drop
      APP_NAME: BlokArcade
      ASC_KEY_PATH: ${{ github.workspace }}/credentials/AuthKey.p8
    steps:
      - uses: actions/checkout@v4

      # One repository secret, RELEASE_BUNDLE, holds everything: a base64-encoded
      # JSON object with EXPO_TOKEN, ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID,
      # ASC_APP_ID, P12_PASSWORD, ASC_KEY_P8 and (optionally, after the first
      # run) IOS_DIST_P12_B64 / IOS_PROFILE_B64.
      - name: Unpack release bundle
        env:
          RELEASE_BUNDLE: ${{ secrets.RELEASE_BUNDLE }}
        run: |
          if [ -z "$RELEASE_BUNDLE" ]; then echo "RELEASE_BUNDLE secret is not set"; exit 1; fi
          mkdir -p credentials
          echo "$RELEASE_BUNDLE" | tr -d ' \n' | base64 -d > credentials/bundle.json
          for k in EXPO_TOKEN ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID ASC_APP_ID P12_PASSWORD IOS_DIST_P12_B64 IOS_PROFILE_B64; do
            v=$(jq -r --arg k "$k" '.[$k] // empty' credentials/bundle.json)
            if [ -n "$v" ]; then echo "::add-mask::$v"; echo "$k=$v" >> "$GITHUB_ENV"; fi
          done
          jq -r '.ASC_KEY_P8' credentials/bundle.json > "$ASC_KEY_PATH"
          rm credentials/bundle.json
          head -c 27 "$ASC_KEY_PATH" | grep -q "BEGIN PRIVATE KEY" || { echo "ASC key looks wrong"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          npm install -g eas-cli@latest
          pip install --quiet pyjwt cryptography requests

      - name: Verify app
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Link EAS project
        run: eas init --force --non-interactive
        env:
          EXPO_NO_TELEMETRY: 1

      # Signing files are kept as sensitive EAS environment variables so every
      # run reuses the same certificate (Apple allows only one per account).
      - name: Fetch stored signing certificate from EAS
        run: |
          # EAS env values are capped at 4 KiB, so the p12 is stored in chunks.
          if [ -z "${IOS_DIST_P12_B64:-}" ]; then
            v=""
            for i in 0 1 2 3; do
              c=$(eas env:get --variable-name "IOS_DIST_P12_B64_$i" --variable-environment production --scope project --format short --non-interactive 2>/dev/null | sed -n "s/^IOS_DIST_P12_B64_$i=//p" | tr -d '[:space:]' || true)
              if [ -z "$c" ] || [ "$c" = "*****" ]; then break; fi
              v="$v$c"
            done
            if [ -n "$v" ]; then echo "::add-mask::$v"; echo "IOS_DIST_P12_B64=$v" >> "$GITHUB_ENV"; echo "loaded stored certificate from EAS ($(echo -n "$v" | wc -c) chars)"; else echo "no stored certificate"; fi
          fi
        env:
          EXPO_NO_TELEMETRY: 1
          FORCE_COLOR: 0

      - name: Provision signing credentials
        run: |
          export EXISTING_P12_B64="$IOS_DIST_P12_B64"
          # Throwaway certs from earlier pipeline attempts (Sep 9 2026) may be revoked;
          # anything older (e.g. BareBible's) is never touched.
          export REVOKE_CERTS_NEWER_THAN_HOURS="${REVOKE_CERTS_NEWER_THAN_HOURS:-12}"
          python scripts/apple_credentials.py

      - name: Store new signing certificate in EAS
        if: hashFiles('credentials/dist.p12.b64') != ''
        run: |
          split -b 3000 -d -a 1 credentials/dist.p12.b64 credentials/chunk_
          for f in credentials/chunk_*; do
            i=${f##*_}
            eas env:set --name "IOS_DIST_P12_B64_$i" --value "$(cat "$f")" --environment production --scope project --visibility sensitive --type string --non-interactive
          done
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Save newly created credentials (reuse them as secrets next time)
        if: hashFiles('credentials/dist.p12.b64') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-signing-credentials
          path: credentials/dist.p12.b64
          retention-days: 7

      - name: EAS build (iOS, production)
        run: eas build --platform ios --profile production --non-interactive --no-wait --json > build.json
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_ASC_API_KEY_PATH: ${{ env.ASC_KEY_PATH }}
          EXPO_ASC_KEY_ID: ${{ env.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ env.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL

      - name: Wait for build
        id: wait
        run: |
          BUILD_ID=$(node -e "const b=require('./build.json');console.log((Array.isArray(b)?b[0]:b).id)")
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Waiting on EAS build $BUILD_ID"
          for i in $(seq 1 120); do
            STATUS=$(eas build:view "$BUILD_ID" --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).status))")
            echo "[$i] $STATUS"
            case "$STATUS" in
              FINISHED) exit 0 ;;
              ERRORED|CANCELED) eas build:view "$BUILD_ID"; exit 1 ;;
            esac
            sleep 45
          done
          echo "Timed out waiting for build"; exit 1
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Submit to App Store Connect
        if: ${{ inputs.submit }}
        run: |
          if [ -z "$ASC_APP_ID" ]; then echo "ASC_APP_ID missing from RELEASE_BUNDLE"; exit 1; fi
          sed -i "s/ASC_APP_ID_PLACEHOLDER/$ASC_APP_ID/" eas.json
          eas submit --platform ios --id "${{ steps.wait.outputs.build_id }}" --profile production --non-interactive
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_ASC_API_KEY_PATH: ${{ env.ASC_KEY_PATH }}
          EXPO_ASC_KEY_ID: ${{ env.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ env.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
